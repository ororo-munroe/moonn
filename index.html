<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon 🌙 — Standalone</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #ffffff;
        --border: #ff66cc;
        --header-bg: linear-gradient(45deg, #f0e6f5, #ffe6f2);
        --input-border: #ff99cc;
        --input-bg: #ffffff;
        --input-text: #333333;
        --reply-bg: #ffe6f2;
        --reply-border: #ff99cc;
        --reply-text: #b10082;
        --send-bg: #cc66ff;
        --send-glow: #ff3399;
        --close-bg: #ffd6f5;
        --close-text: #b10082;
        --regen-bg: #66ccff;
        --key-bg: #ff5e5e;
        --loading-color: #ff66cc;
        --auth-color: red;
        --waiting-color: #d10082;
        --settings-panel-bg: #f8f8f8;
        --settings-panel-border: #cccccc;
        --text: #333;
    }
    .dark-mode {
        --bg: #2b2b2b; --border: #6a0572; --header-bg: linear-gradient(45deg,#3a1c71,#4c268a);
        --input-border: #a13d99; --input-bg: #3a3a3a; --input-text: #e0e0e0;
        --reply-bg: #4a4a4a; --reply-border: #6a0572; --reply-text: #e0b0ff;
        --send-bg: #7f00ff; --send-glow: #e0b0ff; --close-bg: #5a1c8f; --close-text: #e0b0ff;
        --regen-bg: #007bff; --key-bg: #cc0000; --loading-color: #e0b0ff;
        --auth-color: #ff6666; --waiting-color: #e0b0ff;
        --settings-panel-bg: #3a3a3a; --settings-panel-border: #555; --text: #e0e0e0;
    }
    .theme-midnight {
        --bg: #1a1a2e; --border: #0f3460; --header-bg: linear-gradient(45deg,#0f3460,#16213e);
        --input-border: #2e6099; --input-bg: #0f3460; --input-text: #e0f2f7;
        --reply-bg: #2e6099; --reply-border: #0f3460; --reply-text: #e0f2f7;
        --send-bg: #007bff; --send-glow: #6495ed; --close-bg: #16213e; --close-text: #e0f2f7;
        --regen-bg: #00bcd4; --key-bg: #dc3545; --loading-color: #6495ed;
        --auth-color: #ff6666; --waiting-color: #6495ed;
        --settings-panel-bg: #16213e; --settings-panel-border: #0f3460; --text: #e0f2f7;
    }
    .theme-halloween {
        --bg: #1a1a1a; --border: #8b0000; --header-bg: linear-gradient(45deg,#330000,#440000);
        --input-border: #cc0000; --input-bg: #330000; --input-text: #ff8c00;
        --reply-bg: #440000; --reply-border: #8b0000; --reply-text: #ff4500;
        --send-bg: #ff4500; --send-glow: #ffa500; --close-bg: #660000; --close-text: #ff8c00;
        --regen-bg: #4b0082; --key-bg: #8b0000; --loading-color: #ffa500;
        --auth-color: #ff6666; --waiting-color: #ffa500;
        --settings-panel-bg: #333; --settings-panel-border: #444; --text: #ff8c00;
    }
    .theme-valentine {
        --bg: #ffe6f2; --border: #e04482; --header-bg: linear-gradient(45deg,#ffc0cb,#ffb6c1);
        --input-border: #ff69b4; --input-bg: #ffffff; --input-text: #333333;
        --reply-bg: #fbc2eb; --reply-border: #e04482; --reply-text: #a02040;
        --send-bg: #ff1493; --send-glow: #ff69b4; --close-bg: #f7a2d6; --close-text: #a02040;
        --regen-bg: #b364e7; --key-bg: #cc3333; --loading-color: #ff69b4;
        --auth-color: #cc3333; --waiting-color: #ff69b4;
        --settings-panel-bg: #fff0f5; --settings-panel-border: #e04482; --text: #333;
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 20px;
        transition: background 0.3s, color 0.3s;
    }

    #app {
        width: 100%;
        max-width: 860px;
        border: 2px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        background: var(--bg);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    h3 {
        font-family: Georgia, serif;
        font-size: 26px;
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--border);
        background: var(--header-bg);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
    }

    /* AUTH */
    #auth-section p { margin-bottom: 8px; color: var(--text); }
    #cone-id-input {
        width: 100%; padding: 10px; border-radius: 8px;
        border: 1px solid var(--input-border); font-size: 14px;
        background: var(--input-bg); color: var(--input-text); margin-bottom: 10px;
    }
    #auth-message { color: var(--auth-color); margin-top: 8px; font-size: 13px; }
    #waiting-message { text-align: center; color: var(--waiting-color); font-weight: bold; margin-top: 15px; }

    /* CHAT */
    #chat-section { display: none; flex-direction: column; gap: 12px; }

    /* TOAST */
    #toast {
        position: fixed; top: 16px; right: 16px; background: #333; color: #fff;
        padding: 10px 18px; border-radius: 8px; font-size: 13px;
        opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999;
    }
    #toast.show { opacity: 1; }

    /* PERSONA SETTINGS */
    #persona-toggle {
        background: rgba(128,128,128,0.12); border: 1px solid var(--input-border);
        border-radius: 8px; padding: 8px 14px; cursor: pointer;
        font-size: 13px; color: var(--text); text-align: left; width: 100%;
    }
    #persona-panel {
        display: none; background: var(--settings-panel-bg);
        border: 1px solid var(--settings-panel-border); border-radius: 10px;
        padding: 14px; gap: 10px; flex-direction: column;
    }
    #persona-panel.open { display: flex; }
    .persona-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .persona-row input {
        flex: 1; min-width: 160px; padding: 8px 10px; border-radius: 8px;
        border: 1px solid var(--input-border); font-size: 13px;
        background: var(--input-bg); color: var(--input-text);
    }
    .persona-row label { font-size: 12px; color: var(--text); opacity: 0.7; display: block; margin-bottom: 2px; }

    /* INPUT */
    #starr-input {
        width: 100%; padding: 10px; border-radius: 8px;
        border: 1px solid var(--input-border); resize: vertical; min-height: 80px;
        font-size: 14px; background: var(--input-bg); color: var(--input-text);
    }

    /* REPLIES */
    .starr-replies { display: flex; flex-direction: column; gap: 12px; }
    .starr-reply {
        background: var(--reply-bg); padding: 12px 50px 12px 32px;
        border-radius: 12px; border: 1px solid var(--reply-border);
        color: var(--reply-text); white-space: pre-wrap; position: relative;
        font-size: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .starr-reply:hover { opacity: 0.85; }
    .starr-reply::before {
        content: ''; position: absolute; left: 10px; top: 50%;
        transform: translateY(-50%); width: 12px; height: 12px; border-radius: 50%;
        background: #ccc;
    }
    .starr-reply.safe-reply::before { background: #00ff00; box-shadow: 0 0 6px #00ff00; }
    .starr-reply.unsafe-reply::before { background: #ff0000; box-shadow: 0 0 6px #ff0000; }
    .reply-number {
        position: absolute; right: 36px; top: 8px;
        font-size: 10px; font-weight: bold; opacity: 0.5;
    }
    .copy-btn {
        position: absolute; right: 8px; top: 8px;
        background: rgba(0,0,0,0.15); border: none; border-radius: 5px;
        padding: 3px 7px; font-size: 11px; cursor: pointer; color: var(--reply-text);
    }
    .copy-btn:hover { background: rgba(0,0,0,0.3); }

    /* LOADING */
    .starr-loading {
        text-align: center; font-size: 28px; color: var(--loading-color);
        height: 40px; display: none; justify-content: center; align-items: center; gap: 5px;
    }
    .starr-loading.active { display: flex; }
    .starr-loading .emoji { display: inline-block; animation: bounce 1s infinite alternate; }
    .starr-loading .emoji:nth-child(2) { animation-delay: 0.2s; }
    .starr-loading .emoji:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }

    /* BUTTONS */
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn {
        padding: 8px 12px; border-radius: 8px; font-weight: bold;
        border: none; cursor: pointer; flex: 1; min-width: 70px;
        max-width: 110px; text-align: center; font-size: 12px;
        transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    #btn-send { background: var(--send-bg); color: white; position: relative; overflow: hidden; }
    #btn-send.glow::before {
        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: radial-gradient(circle, var(--send-glow) 0%, transparent 70%);
        animation: glow 1.5s infinite alternate; opacity: 0.7; z-index: 0;
    }
    @keyframes glow { 0%{transform:scale(0.8);opacity:.7;} 100%{transform:scale(1.2);opacity:1;} }
    #btn-regen { background: var(--regen-bg); color: white; }
    #btn-key { background: var(--key-bg); color: white; }
    #btn-settings { background: #8844ee; color: white; }

    /* SETTINGS PANEL */
    #settings-panel {
        display: none; flex-direction: column; gap: 10px;
        border: 1px solid var(--settings-panel-border); border-radius: 10px;
        padding: 15px; background: var(--settings-panel-bg);
    }
    #settings-panel.open { display: flex; }
    #settings-panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
    #settings-panel input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .theme-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .theme-btn {
        padding: 6px 10px; border-radius: 8px; background: #8844ee;
        color: white; border: none; cursor: pointer; font-size: 12px; font-weight: bold;
    }
    #duplicate-status {
        font-size: 12px; color: var(--text);
        background: rgba(0,255,0,0.08); border: 1px solid rgba(0,255,0,0.3);
        border-radius: 8px; padding: 10px;
    }
    .export-import-row { display: flex; gap: 8px; margin-top: 6px; }
    .export-import-row button {
        flex: 1; padding: 8px; border: none; border-radius: 6px;
        font-weight: bold; font-size: 12px; cursor: pointer; color: white;
    }
    #btn-export { background: #00aa00; }
    #btn-import { background: #0066cc; }

    #submit-cone-id {
        padding: 8px 18px; background: #cc66ff; color: white;
        border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
</style>
</head>
<body>

<div id="toast"></div>

<div id="app">
    <h3>Talk to Moon, baby💦...</h3>

    <!-- AUTH -->
    <div id="auth-section">
        <p>Please enter your CONE ID to access Moon:</p>
        <input type="text" id="cone-id-input" placeholder="Enter CONE ID (e.g. CONE844)" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" style="font-size:16px;">
        <button id="submit-cone-id">Submit</button>
        <p id="auth-message"></p>
    </div>

    <div id="waiting-message" style="display:none;"></div>

    <!-- CHAT -->
    <div id="chat-section">

        <!-- PERSONA SETTINGS -->
        <button id="persona-toggle">⚙️ Persona Settings (click to expand)</button>
        <div id="persona-panel">
            <p style="font-size:12px;opacity:0.7;">These replace the platform-scraped values. Fill in before chatting.</p>
            <div class="persona-row">
                <div><label>Persona Name</label><input id="p-name" placeholder="e.g. Jess" value="the other person"></div>
                <div><label>Persona Age</label><input id="p-age" placeholder="e.g. 27" value="unknown"></div>
            </div>
            <div class="persona-row">
                <div><label>Persona Status</label><input id="p-status" placeholder="e.g. Single" value="unknown"></div>
                <div><label>Persona Location</label><input id="p-location" placeholder="e.g. Dallas, TX" value="an unknown location"></div>
            </div>
        </div>

        <!-- OPERATOR MESSAGE (context) -->
        <div>
            <p style="font-size:12px;opacity:0.7;margin-bottom:4px;">Previous operator message (optional — gives the AI context of what was already said)</p>
            <textarea id="operator-input" placeholder="Paste the previous operator message here..." style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--input-border);resize:vertical;min-height:60px;font-size:14px;background:var(--input-bg);color:var(--input-text);margin-bottom:4px;"></textarea>
        </div>

        <!-- CLIENT MESSAGE -->
        <div>
            <p style="font-size:12px;opacity:0.7;margin-bottom:4px;">Client message (what you are replying to)</p>
            <textarea id="starr-input" placeholder="Paste the client message here..."></textarea>
        </div>

        <!-- RESPONSES -->
        <div class="starr-replies" id="starr-responses"></div>

        <!-- LOADING -->
        <div class="starr-loading" id="starr-loading">
            <span class="emoji">😘</span><span class="emoji">🥰</span><span class="emoji">💋</span>
        </div>

        <!-- BUTTONS -->
        <div class="btn-row">
            <button class="btn" id="btn-send">Send</button>
            <button class="btn" id="btn-regen">Regenerate</button>
            <button class="btn" id="btn-new-client" style="background:#ff9900;color:white;">New Client</button>
            <button class="btn" id="btn-key">New API Key</button>
            <button class="btn" id="btn-settings">Settings</button>
        </div>

        <!-- SETTINGS PANEL -->
        <div id="settings-panel">
            <label><input type="checkbox" id="dark-mode-toggle"> Dark Mode</label>
            <label><input type="checkbox" id="glow-toggle" checked> Send Button Glow</label>
            <label><input type="checkbox" id="voice-toggle" checked> Voice Reply (first response)</label>
            <div>
                <p style="font-size:12px;margin-bottom:6px;font-weight:bold;">Theme:</p>
                <div class="theme-buttons">
                    <button class="theme-btn" data-theme="bubblegum">Bubblegum</button>
                    <button class="theme-btn" data-theme="midnight">Midnight</button>
                    <button class="theme-btn" data-theme="halloween">Halloween</button>
                    <button class="theme-btn" data-theme="valentine">Valentine</button>
                </div>
            </div>
            <div id="duplicate-status">Loading...</div>
            <div class="export-import-row">
                <button id="btn-export">Export</button>
                <button id="btn-import">Import</button>
            </div>
            <input type="file" id="import-file-input" accept=".json" style="display:none;">
        </div>

    </div><!-- end chat-section -->
</div><!-- end app -->

<script>
// =====================================================================
// GM SHIMS — replaces Tampermonkey APIs with localStorage equivalents
// =====================================================================
function GM_setValue(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
}
function GM_getValue(key, defaultVal) {
    try {
        const v = localStorage.getItem(key);
        if (v === null || v === undefined) return defaultVal;
        return JSON.parse(v);
    } catch(e) { return defaultVal; }
}
function GM_notification(opts) {
    showToast((opts.title ? opts.title + ': ' : '') + (opts.text || ''));
    if (opts.onclick) opts.onclick();
}
function GM_setClipboard(text) {
    navigator.clipboard.writeText(text).catch(() => {});
}

function showToast(msg, duration = 4000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

// =====================================================================
// MAIN APP
// =====================================================================
(function() {
    'use strict';

    const authorizedConeIds = ["CONE823", "CONE339", "CONE844"];

    let isAuthorized = false;
    let storedUserConeId = null;
    let accessDeniedPermanent = false;
    let isFetching = false;
    let conversationHistory = [];
    let allRepliesCache = [];

    // ---- DOM refs ----
    const authSection      = document.getElementById('auth-section');
    const chatSection      = document.getElementById('chat-section');
    const waitingMessage   = document.getElementById('waiting-message');
    const coneIdInput      = document.getElementById('cone-id-input');
    const submitConeBtn    = document.getElementById('submit-cone-id');
    const authMessage      = document.getElementById('auth-message');
    const starrInput       = document.getElementById('starr-input');
    const starrResponses   = document.getElementById('starr-responses');
    const starrLoading     = document.getElementById('starr-loading');
    const btnSend          = document.getElementById('btn-send');
    const btnRegen         = document.getElementById('btn-regen');
    const btnKey           = document.getElementById('btn-key');
    const btnSettings      = document.getElementById('btn-settings');
    const settingsPanel    = document.getElementById('settings-panel');
    const darkToggle       = document.getElementById('dark-mode-toggle');
    const glowToggle       = document.getElementById('glow-toggle');
    const voiceToggle      = document.getElementById('voice-toggle');
    const personaToggle    = document.getElementById('persona-toggle');
    const personaPanel     = document.getElementById('persona-panel');

    // =========================================================
    // ANTI-DUPLICATE — 20000 AI + 5000 CLIENT
    // =========================================================
    const MAX_AI_MESSAGES     = 20000;
    const MAX_CLIENT_MESSAGES = 5000;
    const SIM_HARD = 0.90, SIM_MED = 0.80, SIM_SOFT = 0.70;

    const getAiMessages     = () => { try { return JSON.parse(GM_getValue('moon_ai_history','[]')); } catch(e){ return []; } };
    const getClientMessages = () => { try { return JSON.parse(GM_getValue('moon_client_history','[]')); } catch(e){ return []; } };
    const saveAiMessages    = m  => { try { GM_setValue('moon_ai_history', JSON.stringify(m)); } catch(e){} };
    const saveClientMessages= m  => { try { GM_setValue('moon_client_history', JSON.stringify(m)); } catch(e){} };

    // =========================================================
    // PHRASE-LEVEL DETECTION
    // =========================================================
    const MAX_PHRASE_HISTORY = 4000;

    // Stop words excluded from key word frequency tracking
    const STOP_WORDS = new Set(['i','you','me','my','your','we','us','a','an','the','and','or','but','so','to','of','in','it','is','was','be','do','did','have','had','will','would','could','can','just','like','that','this','what','how','when','where','who','not','no','yes','oh','if','for','on','up','he','she','they','at','as','by','with','from','are','been','get','got','let','its','all','out','one','then','than','so','too','very','more']);

    // Extract n-grams of multiple sizes (4, 5, 6, 8)
    function extractAllPhrases(text) {
        const words = text.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(w=>w.length>0);
        const out = [];
        [4, 5, 6, 8].forEach(n => {
            for (let i=0; i<=words.length-n; i++) out.push(words.slice(i,i+n).join(' '));
        });
        return out;
    }

    // Extract significant (non-stop) words from a response
    function extractKeyWords(text) {
        return text.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(w => w.length > 3 && !STOP_WORDS.has(w));
    }

    function rebuildPhraseSet() {
        const msgs = getAiMessages().slice(-MAX_PHRASE_HISTORY);
        const s = new Set();
        msgs.forEach(m => extractAllPhrases(m.text).forEach(p => s.add(p)));
        return s;
    }

    // Build a frequency map of key words from recent responses
    function buildKeyWordFrequencyMap(windowSize = 150) {
        const msgs = getAiMessages().slice(-windowSize);
        const freq = {};
        msgs.forEach(m => {
            extractKeyWords(m.text).forEach(w => { freq[w] = (freq[w] || 0) + 1; });
        });
        return freq;
    }

    function isPhraseRepeat(text) {
        // Check 1: n-gram phrase overlap
        const s = rebuildPhraseSet();
        let hits = 0;
        for (const p of extractAllPhrases(text)) { if (s.has(p) && ++hits >= 2) return true; }

        // Check 2: Key word frequency — flag if too many significant words are overused recently
        const freq = buildKeyWordFrequencyMap(150);
        const newWords = extractKeyWords(text);
        let overusedHits = 0;
        newWords.forEach(w => { if (freq[w] && freq[w] >= 5) overusedHits++; });
        if (overusedHits >= 3) return true;

        return false;
    }

    // =========================================================
    // OPENER / CLOSER UNIQUENESS
    // =========================================================
    const OPENER_CLOSER_WINDOW = 200;

    const extractOpener = t => t.trim().toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean).slice(0,4).join(' ');
    const extractCloser = t => {
        const sents = t.trim().match(/[^.?!]+[.?!]*/g) || [t.trim()];
        return (sents[sents.length-1]||'').toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean).slice(-5).join(' ');
    };
    const getOpenerHistory = () => { try { return JSON.parse(GM_getValue('moon_opener_history','[]')); } catch(e){ return []; } };
    const getCloserHistory = () => { try { return JSON.parse(GM_getValue('moon_closer_history','[]')); } catch(e){ return []; } };
    const saveOpenerHistory= a  => { try { GM_setValue('moon_opener_history', JSON.stringify(a)); } catch(e){} };
    const saveCloserHistory= a  => { try { GM_setValue('moon_closer_history', JSON.stringify(a)); } catch(e){} };

    function isOpenerOrCloserRepeat(text) {
        const opener = extractOpener(text), closer = extractCloser(text);
        const openers = getOpenerHistory().slice(-OPENER_CLOSER_WINDOW);
        const closers = getCloserHistory().slice(-OPENER_CLOSER_WINDOW);
        if (opener.length>=3 && openers.includes(opener)) return true;
        if (closer.length>=3 && closers.includes(closer)) return true;
        return false;
    }
    function recordOpenerAndCloser(text) {
        const opener = extractOpener(text), closer = extractCloser(text);
        const openers = getOpenerHistory(); openers.push(opener); if (openers.length>250) openers.shift(); saveOpenerHistory(openers);
        const closers = getCloserHistory(); closers.push(closer); if (closers.length>250) closers.shift(); saveCloserHistory(closers);
    }

    // =========================================================
    // LEGACY MIGRATION
    // =========================================================
    (function migrate() {
        const legacy = GM_getValue('moon_message_history','');
        if (!legacy) return;
        try {
            const all = JSON.parse(legacy);
            if (!Array.isArray(all)||all.length===0) return;
            const ai=all.filter(m=>m.type==='ai'), client=all.filter(m=>m.type==='client');
            if (ai.length>0) saveAiMessages(ai.slice(-MAX_AI_MESSAGES));
            if (client.length>0) saveClientMessages(client.slice(-MAX_CLIENT_MESSAGES));
            GM_setValue('moon_message_history','');

    function calcSim(a, b) {
        const s1=a.toLowerCase().trim().replace(/\s+/g,' '), s2=b.toLowerCase().trim().replace(/\s+/g,' ');
        if (s1===s2) return 1; if (!s1||!s2) return 0;
        const w1=s1.split(' '), w2=s2.split(' ');
        let m=0; w1.forEach(w=>{ if(w2.includes(w)&&w.length>2) m++; });
        return (m/Math.max(w1.length,w2.length))*0.7 + (Math.min(s1.length,s2.length)/Math.max(s1.length,s2.length))*0.3;
    }
    function isDuplicate(text, type) {

            if (sim>=SIM_MED)  return {isDuplicate:true,sim,level:'medium'};
            if (sim>=SIM_SOFT) return {isDuplicate:true,sim,level:'soft'};
